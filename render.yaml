services:
  - type: web
    name: scamshield-api
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn backend.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: scamshield-api.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://scamshield-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://scamshield-web.onrender.com
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CSRF_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: scamshield-db
          property: connectionString
  - type: web
    name: scamshield-web
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_BASE_URL
        value: https://scamshield-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
databases:
  - name: scamshield-db
    plan: free
