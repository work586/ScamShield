services:
  - type: web
    name: scamshield-api
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    healthCheckPath: /api/history/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # e.g. https://scamshield-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        sync: false   # same as above (needed for /admin)
      - key: DATABASE_URL
        sync: false   # paste your Neon connection string

  - type: web
    name: scamshield-web
    runtime: static
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_BASE_URL
        sync: false   # e.g. https://scamshield-api.onrender.com (no trailing slash)
